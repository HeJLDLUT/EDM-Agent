  <text x="60" y="200" class="label">1</text>
  <text x="92" y="201" class="label">Processing Agent</text>
  <circle cx="459" cy="193" r="15" fill="#dce7f3"/>
  <text x="454" y="200" class="label">2</text>
  <text x="486" y="201" class="label">Extraction Agent</text>
  <circle cx="855" cy="193" r="15" fill="#f6e5ca"/>
  <text x="850" y="200" class="label">3</text>
  <text x="882" y="201" class="label">Audit &amp; Revision Agent</text>
  <path d="M66 224Q66 218 74 218H343Q351 218 351 226V262Q351 270 343 270H223L207 286L207 270H74Q66 270 66 262Z" fill="#faf9f5" stroke="#232323" stroke-width="2"/>
  <text x="90" y="251" font-size="22" font-weight="650">“Keep the source close.”</text>
  <path d="M459 224Q459 218 467 218H735Q743 218 743 226V262Q743 270 735 270H617L600 286L600 270H467Q459 270 459 262Z" fill="#faf9f5" stroke="#232323" stroke-width="2"/>
  <text x="486" y="251" font-size="22" font-weight="650">“Give each fact a field.”</text>
  <path d="M851 224Q851 218 859 218H1133Q1141 218 1141 226V262Q1141 270 1133 270H1012L995 286L995 270H859Q851 270 851 262Z" fill="#faf9f5" stroke="#232323" stroke-width="2"/>
  <text x="889" y="251" font-size="22" font-weight="650">“Show me the evidence.”</text>
