<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704" role="img" aria-labelledby="title description">
  <title id="title">EDM-Agent: three agents, an evidence trail, and a correction loop</title>
  <desc id="description">The Processing Agent prepares source-tagged text. The Extraction Agent creates typed kinetics records. The Audit and Revision Agent independently checks the draft against the source and applies validated patches. Flagged papers return to extraction with feedback. The Processing Agent then enriches and exports records. A controller routes the stages and limits retries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#232323" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#232323}
      .ink{fill:none;stroke:#232323;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .small{font-size:19px}
      .label{font-size:20px;font-weight:650}
      .mono{font-family:Consolas,monospace;font-size:18px}
    </style>
  </defs>
  <rect width="1200" height="704" rx="18" fill="#faf9f5"/>
  <text x="38" y="43" font-size="15" font-weight="650" letter-spacing="2.3">ENVIRONMENTAL LITERATURE → STRUCTURED DATA</text>
  <text x="36" y="111" font-size="58" font-weight="800" letter-spacing="-2">EDM-Agent</text>
  <path d="M39 125Q172 120 302 126" fill="none" stroke="#edb468" stroke-width="7" stroke-linecap="round"/>
  <text x="434" y="92" font-size="27" font-weight="650">Read. Extract. Question. Refine.</text>
  <text x="435" y="125" class="small" fill="#62615d">Three agents, with evidence carried through every stage.</text>
